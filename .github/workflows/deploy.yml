name: Deploy to DigitalOcean

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to DigitalOcean Droplet
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Deploy and build on droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          port: ${{ secrets.DO_SSH_PORT }}
          script_stop: true
          command_timeout: 8m
          script: |
            set -e
            cd /opt/cortexwave

            echo "=== Pulling latest code ==="
            git fetch origin main
            git reset --hard origin/main

            echo "=== Building cortexwave ==="
            cd /opt/checkmycars/deploy
            docker compose build cortexwave

            echo "=== Restarting cortexwave ==="
            docker compose up -d cortexwave

            echo "=== Health check ==="
            sleep 5
            if curl -sf http://localhost:3001 > /dev/null 2>&1; then
              echo "CortexWave is healthy"
            else
              echo "CortexWave not responding"
              docker logs deploy-cortexwave-1 --tail 30
              exit 1
            fi

            echo "Deployment complete!"
